<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha senha · Avelu</title><link rel="stylesheet" href="paginas.css"><link rel="stylesheet" href="conta.css"><link rel="stylesheet" href="workspace.css"></head><body><main class="shell"><h1>Proteja sua conta</h1><p>Use uma senha pessoal de pelo menos 8 caracteres. Senhas curtas usadas nos testes precisam ser substituídas.</p><form id="change-password" class="op-card"><label for="old">Senha atual</label><input id="old" type="password" autocomplete="current-password" required maxlength="128"><label for="new">Nova senha</label><input id="new" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><label for="repeat">Repita a nova senha</label><input id="repeat" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><p id="message" role="status"></p><button class="btn btn-primary">Salvar senha e entrar novamente</button></form><a href="entrar.html">Voltar para o login</a></main><script src="senha.js" defer></script></body></html>
