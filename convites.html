<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convites — Avelu</title><link rel="stylesheet" href="paginas.css"><link rel="stylesheet" href="conta.css"><link rel="stylesheet" href="workspace.css"></head>
<body><header><nav class="container account-nav"><a href="admin.html">← Administração</a><button id="logout" class="btn btn-light">Sair</button></nav></header>
<main class="container admin-main"><h1>Convide sua equipe de testes</h1><p>O link será enviado somente ao e-mail convidado. Use nomes e informações fictícios nos testes. O perfil abaixo define o módulo de acesso; os vínculos de equipe continuam sendo liberados separadamente.</p>
<form id="invitation-form" class="account-card"><div class="field"><label for="email">E-mail do convidado</label><input id="email" name="email" type="email" maxlength="190" required></div><div class="field"><label for="role">Perfil de acesso</label><select id="role" name="role"><option value="paciente">Cliente/paciente</option><option value="profissional">Profissional</option><option value="equipe">Equipe/recepção</option></select></div><button class="btn btn-primary" type="submit">Enviar convite por e-mail</button></form>
<p id="message" role="status" aria-live="polite"></p><h2>Últimos convites</h2><button id="refresh" class="btn btn-light">Atualizar</button><div id="invitations"></div></main><script src="convites.js" defer></script><script src="workspace.js" defer></script></body></html>
