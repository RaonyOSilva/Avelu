<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0ea56b"><title>Recuperar acesso — Avelu</title><link rel="icon" href="assets/icon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="paginas.css"><link rel="stylesheet" href="conta.css"></head>
<body><header><nav class="container account-nav"><a href="index.html"><img class="logo" src="assets/logo.png" alt="Avelu — início"></a><a href="entrar.html">Voltar para entrar</a></nav></header><main class="container booking-layout"><section class="account-card"><h1 id="recovery-title">Recupere seu acesso</h1><p id="recovery-note">Informe o e-mail da sua conta para receber um link de recuperação.</p><form id="recovery-form"><div class="field" id="email-field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" maxlength="190" required></div><div class="field" id="new-password-field" hidden><label for="password">Nova senha</label><input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" disabled><small>Use pelo menos 8 caracteres.</small></div><button class="btn btn-primary" type="submit">Enviar link de recuperação</button></form><p id="recovery-message" role="status" aria-live="polite"></p><a class="text-link" id="recovery-next" href="entrar.html">Voltar para entrar</a></section></main><script src="recuperar.js" defer></script></body></html>
